    const loadPermanentPlannerData=()=>{ const defaults=buildInitialData(); try{const raw=localStorage.getItem(PRIMARY_STORAGE_KEY); if(!raw)return defaults; const parsed=JSON.parse(raw); if(!parsed||typeof parsed!=='object')return defaults; const savedLectures=new Map(Array.isArray(parsed.lectures)?parsed.lectures.map(l=>[l.id,l]):[]); const lectures=defaults.lectures.map(l=>savedLectures.get(l.id)?{...l,...savedLectures.get(l.id)}:l); const savedChapters=new Map(Array.isArray(parsed.chapters)?parsed.chapters.map(c=>[c.id,c]):[]); const chapters=defaults.chapters.map(c=>savedChapters.get(c.id)?{...c,...savedChapters.get(c.id)}:c); return {...defaults,...parsed,chapters,lectures,settings:{...defaults.settings,...(parsed.settings||{})}};}catch{return defaults;} };

      const stats=useMemo(()=>{
        const chapterStatsMap={};
        appData.chapters.forEach(ch=>{const chLecs=appData.lectures.filter(l=>l.chapterId===ch.id);const totalLectures=chLecs.length;const completedLectures=chLecs.filter(l=>l.status==='Completed').length;const lecturePct=totalLectures>0?Math.round(completedLectures/totalLectures*100):0;const isCompleted=ch.completedManual||(totalLectures>0&&completedLectures===totalLectures);chapterStatsMap[ch.id]={...ch,totalLectures,completedLectures,totalNotes:appData.notes.filter(n=>n.chapterId===ch.id).length,totalDpps:appData.dpps.filter(d=>d.chapterId===ch.id).length,totalExercises:appData.exercises.filter(e=>e.chapterId===ch.id).length,isCompleted,progressPct:isCompleted?100:lecturePct};});
        const subjectStatsMap={};
        SUBJECTS.forEach(subj=>{const subjChs=appData.chapters.filter(c=>c.subjectId===subj.id).map(c=>chapterStatsMap[c.id]);const subjLecs=appData.lectures.filter(l=>l.subjectId===subj.id);const totalLectures=subjLecs.length;const completedLectures=subjLecs.filter(l=>l.status==='Completed').length;const totalChapters=subjChs.length;const completedChapters=subjChs.filter(c=>c.isCompleted).length;const datedDue=subjLecs.filter(l=>l.date!=='Recorded'&&l.date<=referenceDateISO).length;const recordedTotal=subjLecs.filter(l=>l.date==='Recorded').length;const expectedLecturesDue=Math.min(totalLectures,datedDue+recordedTotal);const backlogLectures=Math.max(0,expectedLecturesDue-completedLectures);const paceRatio=expectedLecturesDue>0?Math.round(completedLectures/expectedLecturesDue*100):100;subjectStatsMap[subj.id]={...subj,totalChapters,completedChapters,pendingChapters:totalChapters-completedChapters,totalLectures,completedLectures,completionPct:totalLectures?Math.round(completedLectures/totalLectures*100):0,expectedLecturesDue,backlogLectures,riskStatus:paceRatio<65||backlogLectures>=8?'AT RISK':paceRatio<88||backlogLectures>=3?'MODERATE RISK':'SAFE'};});
        const totalChapters=appData.chapters.length;const completedChapters=Object.values(chapterStatsMap).filter(c=>c.isCompleted).length;const totalLectures=appData.lectures.length;const completedLectures=appData.lectures.filter(l=>l.status==='Completed').length;const pendingLectures=totalLectures-completedLectures;const totalExpectedDue=Object.values(subjectStatsMap).reduce((a,s)=>a+s.expectedLecturesDue,0);const totalBacklogDue=Math.max(0,totalExpectedDue-completedLectures);const overallPaceRatio=totalExpectedDue?Math.round(completedLectures/totalExpectedDue*100):100;const daysLeftToExam=Math.max(1,Math.ceil((new Date(appData.settings.examDate).getTime()-new Date(referenceDateISO).getTime())/86400000));return {chapterStatsMap,subjectStatsMap,totalChapters,completedChapters,pendingChapters:totalChapters-completedChapters,totalLectures,completedLectures,pendingLectures,overallPct:totalLectures?Math.round(completedLectures/totalLectures*100):0,overallRisk:overallPaceRatio<65||totalBacklogDue>=15?'AT RISK':overallPaceRatio<88||totalBacklogDue>=6?'MODERATE RISK':'SAFE',requiredDailyVelocity:(pendingLectures/daysLeftToExam).toFixed(1),projectedCompletionDate:addDaysISO(referenceDateISO,Math.ceil(pendingLectures/Math.max(.5,simulatedPacePerDay)))};

              {['materials','revision','timer','mtp-rtp','backlog','analytics'].includes(activeNav)&&<div className="p-6 rounded-2xl bg-[#141418] border border-[#272730] space-y-4 animate-view-enter"><div className="flex justify-between items-center"><h1 className="text-xl font-black text-white uppercase">{activeNav.replace('-',' ')}</h1><a href="https://www.lifelonglearner.in/free-resource" target="_blank" rel="noopener noreferrer" className="px-4 py-2 rounded-xl bg-purple-600 text-white text-xs font-bold">Open Lifelong Learner PYQ / RTP / MTP PDFs</a></div><p className="text-xs text-zinc-400">All updates in this module are automatically saved to your browser storage.</p></div>}

              {activeNav==='silent-meet'&&<div className="max-w-3xl mx-auto p-6 sm:p-8 rounded-2xl bg-[#141418] border border-emerald-500/40 glow-emerald space-y-5 animate-view-enter"><div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/15 border border-emerald-500/40 text-emerald-300 text-xs font-black uppercase"><span>Official 24×7 Silent Study Meet • Host: CA. Beeresh</span></div><h1 className="text-2xl font-black text-white">CA SAMPURNA MAY 2027 — SILENT GOOGLE MEET</h1><p className="text-xs sm:text-sm text-zinc-300">Hosted by <strong className="text-purple-400">CA. Beeresh</strong>. One single valid Google Meet link for every serious aspirant. Zero discussion — microphones muted, camera on for silent accountability.</p><div className="p-4 rounded-xl bg-[#0d0d11] border border-[#282834] flex flex-col sm:flex-row items-center justify-between gap-3"><span className="text-xs font-mono text-emerald-300 truncate">{unifiedSilentMeet.meetUrl}</span><div className="flex gap-2"><a href={unifiedSilentMeet.meetUrl} target="_blank" rel="noopener noreferrer" className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-black uppercase">Join Silent Google Meet</a><a href="https://meet.google.com/new" target="_blank" rel="noopener noreferrer" className="px-4 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold">Host (CA. Beeresh): New Meet</a></div></div><div className="flex gap-2"><input type="url" value={unifiedSilentMeet.meetUrl} onChange={e=>setUnifiedSilentMeet({meetUrl:e.target.value,hostName:'CA. Beeresh'})} placeholder="Paste valid https://meet.google.com/xxx-xxxx-xxx link here..." className="flex-1 px-3 py-2 rounded-xl bg-[#121216] border border-[#2e2e3a] text-xs text-white"/></div></div>}

              {activeNav==='settings'&&<div className="max-w-xl p-6 rounded-2xl bg-[#141418] border border-[#272730] space-y-4 animate-view-enter"><h1 className="text-xl font-black text-white">Planner Settings</h1><div><label className="block text-xs text-zinc-400 mb-1">Your Name (CA. Prefix)</label><input type="text" value={cleanStudentName} onChange={e=>setAppData(prev=>({...prev,settings:{...prev.settings,studentName:e.target.value}}))} className="w-full px-3 py-2 rounded-xl bg-[#1c1c22] border border-[#2e2e3a] text-xs text-white"/></div></div>}
            </main>
          </div>
        </div>
      );
    }

    const root=ReactDOM.createRoot(document.getElementById('root'));root.render(<App/>);
  </script>
</body>
</html>
